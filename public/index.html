<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="/manifest.webmanifest">

<title>IT-Nachrichten · News-Cockpit</title>

<!-- Oberflächen-Standard (skills-bibliothek/claude-code-global/oberflaechen-standard), unverändert kopiert.
     Aktualisieren: Dateien aus assets/ nach public/oberflaeche/ kopieren, nie hier editieren. -->
<link rel="stylesheet" href="/oberflaeche/tokens.css">
<link rel="stylesheet" href="/oberflaeche/material.css">
<link rel="stylesheet" href="/oberflaeche/komponenten.css">
<script src="/oberflaeche/licht.js" defer></script>
<style>
  /* ============================================================
     News-Cockpit auf dem Oberflächen-Standard.
     Akzent bleibt Blau (Standard). CI-Regel: Rot NUR für die
     Wichtig-Markierung (plus Löschen-Bestätigung und Fehler),
     Amber für Content-Ideen und Notizen, Grün für „gepostet“.
     Alles hier nutzt die Tokens des Standards, keine eigenen Hexwerte.
     ============================================================ */
  :root {
    --font: "Source Sans 3", "Source Sans Pro", "Segoe UI", system-ui, Arial, sans-serif;
    --serif: Georgia, "Times New Roman", serif;
    --rot: var(--danger);       --rot-soft: var(--danger-soft);
    --amber: var(--warn);       --amber-soft: var(--warn-soft);
    --gruen: var(--ok);         --gruen-soft: var(--ok-soft);
  }
  body { font-size: 16px; line-height: 1.55; }
  /* Auf sehr breiten Bildschirmen nicht bis an den Rand ziehen */
  .shell { max-inline-size: 1680px; margin-inline: auto; }
  ::selection { background: color-mix(in oklch, var(--accent) 35%, transparent); }

  /* ---------- Marke ---------- */
  .brand-mark { font-family: var(--serif); font-style: italic; font-size: 19px; font-weight: 700; }
  .brand-name { font-family: var(--serif); font-size: 20px; letter-spacing: -0.015em; white-space: nowrap; }
  .brand-dot { color: var(--rot); }
  .side-foot { display: flex; align-items: center; gap: 8px; padding: 10px 12px 2px; font-size: 12.5px; color: var(--text-3); }
  .pulse { inline-size: 7px; aspect-ratio: 1; border-radius: 50%; background: var(--gruen); animation: pulse 2.6s infinite; flex: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* ---------- Kopf ---------- */
  .hero h1 { text-wrap: balance; }
  .kpi.wichtig strong { color: var(--rot); }
  .tools .icon-btn[disabled] { opacity: .45; cursor: default; }
  .mobile-only { display: none; }

  /* ---------- Briefing-/Experiment-Karten ---------- */
  .lage { display: grid; gap: var(--gap); grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .lage:empty { display: none; }
  .lage .card { grid-column: span 6; }
  .lage .card:only-child { grid-column: 1 / -1; }
  .b-zahl { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .b-zahl strong { font-size: 30px; font-weight: 780; letter-spacing: -0.03em; }
  .b-zahl span { color: var(--text-2); }
  .b-hinweis { font-size: 13px; color: var(--text-2); }
  .mix { display: flex; block-size: 10px; border-radius: 6px; overflow: hidden; gap: 3px; box-shadow: var(--inset-well); }
  .mix i { flex: var(--n) 1 0; border-radius: 6px; animation: grow-x .8s var(--ease) both; animation-delay: .25s; }
  @keyframes grow-x { from { flex-grow: 0; } }
  .mix .news { background: oklch(0.64 var(--accent-c) var(--accent-h)); box-shadow: 0 0 10px oklch(0.64 var(--accent-c) var(--accent-h) / .5); }
  .mix .idee { background: var(--amber); }
  .mix .zitat { background: var(--text-3); }
  .mix-legende { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); }
  .mix-legende span { display: inline-flex; align-items: center; gap: 6px; }
  .mix-legende i { inline-size: 10px; block-size: 10px; border-radius: 3px; }
  .mix-legende .news { background: oklch(0.64 var(--accent-c) var(--accent-h)); }
  .mix-legende .idee { background: var(--amber); }
  .mix-legende .zitat { background: var(--text-3); }
  .arm { display: grid; gap: 10px; }
  .arm-zahlen { display: flex; gap: 18px; flex-wrap: wrap; }
  .arm-zahlen div { display: grid; }
  .arm-zahlen strong { font-size: 24px; font-weight: 750; letter-spacing: -0.02em; }
  .arm-zahlen span { font-size: 12.5px; color: var(--text-2); font-weight: 600; }
  .arm-median { font-size: 13px; color: var(--text-2); }

  /* ---------- Liste ---------- */
  .liste-card { gap: 6px; }
  .liste-card .card-head { margin-bottom: 6px; flex-wrap: wrap; }
  .kinds .kind-chip { border: 0; background: none; padding: 5px 12px; border-radius: var(--r-pill); font-size: 13px; font-weight: 650; color: var(--text-2); transition: color var(--t), background-color var(--t); }
  .kinds .kind-chip.active { background: linear-gradient(172deg, var(--sheen), transparent 70%), var(--surface-solid); color: var(--text); box-shadow: var(--depth), 0 2px 6px -2px var(--drop-far); }

  .entry {
    /* Textspalte mit lesbarer Höchstbreite, Aktionen direkt daneben statt am Kartenrand */
    position: relative; display: grid; grid-template-columns: minmax(0, 92ch) auto; justify-content: start; gap: 4px 20px;
    padding: 16px 14px 16px 20px; border-radius: var(--r-lg);
    animation: entry-in .5s var(--ease) both;
    transition: background-color var(--t) var(--ease), opacity .3s, translate .3s;
  }
  @keyframes entry-in { from { opacity: 0; translate: 0 9px; } }
  .entry::before { content: ""; position: absolute; inset: 16px auto 16px 0; inline-size: 3px; border-radius: 3px; background: transparent; transition: background-color var(--t); }
  @media (hover: hover) { .entry:hover { background: color-mix(in oklch, var(--text) 4%, transparent); } }
  .entry.important { background: linear-gradient(90deg, var(--rot-soft), transparent 55%); }
  .entry.important::before { background: var(--rot); box-shadow: 0 0 12px color-mix(in oklch, var(--rot) 55%, transparent); }
  .entry.leaving { opacity: 0; translate: 10px 0; }
  .entry .meta { grid-column: 1; display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
  .entry .source { color: var(--text-2); font-weight: 700; }
  .entry .sep { color: var(--text-3); }
  .entry .time { color: var(--text-3); font-variant-numeric: tabular-nums; font-weight: 600; }
  .entry h2 { grid-column: 1; font-size: 17.5px; font-weight: 650; line-height: 1.4; margin-top: 4px; letter-spacing: -0.005em; text-wrap: pretty; }
  .entry h2 a { color: inherit; text-decoration: none; }
  .entry h2 a:hover { text-decoration: underline; text-decoration-color: var(--accent-text); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .entry .summary { grid-column: 1; color: var(--text-2); font-size: 15px; line-height: 1.6; margin-top: 4px; }
  .entry .summary.zitat { font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--text); border-inline-start: 2px solid var(--line); padding-inline-start: 14px; margin-top: 8px; }

  .chip.idee { color: var(--amber); background: var(--amber-soft); }
  .chip.zitat { font-family: var(--serif); font-style: italic; }
  .chip.pillar { color: var(--text-2); }
  .chip.archiviert { color: var(--text-3); }
  .chip.gepostet { color: var(--gruen); background: var(--gruen-soft); }
  .chip.verwertet { color: var(--gruen); background: transparent; box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--gruen) 45%, transparent); }
  .chip.format { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--text-2); }
  .d-score { font-size: 12.5px; font-weight: 700; padding: 2px 8px; border-radius: var(--r-sm); font-variant-numeric: tabular-nums; }
  .d-score.hoch, .pruef-score.hoch { color: var(--gruen); background: var(--gruen-soft); }
  .d-score.mittel, .pruef-score.mittel { color: var(--amber); background: var(--amber-soft); }
  .d-score.gering, .pruef-score.gering { color: var(--rot); background: var(--rot-soft); }

  .entry-actions {
    grid-column: 2; grid-row: 1 / span 3; align-self: start;
    display: flex; gap: 2px; opacity: 0; translate: 4px 0;
    transition: opacity var(--t) var(--ease), translate var(--t) var(--ease);
  }
  .entry:hover .entry-actions, .entry:focus-within .entry-actions { opacity: 1; translate: 0 0; }
  @media (hover: none) { .entry-actions { opacity: 1; translate: 0 0; } }
  .entry-actions button {
    inline-size: 36px; block-size: 36px; border: 0; border-radius: var(--r-md); background: none;
    color: var(--text-3); display: inline-grid; place-items: center;
    transition: background-color var(--t-fast), color var(--t-fast);
  }
  .entry-actions button:hover { background: var(--surface-2); color: var(--text); }
  .entry-actions button.star-on { color: var(--rot); }
  .entry-actions button.note-on { color: var(--amber); }
  .entry-actions button.check-on { color: var(--gruen); }
  .entry-actions button.confirm { inline-size: auto; padding: 0 12px; color: oklch(0.99 0 0); background: var(--rot); font-size: 13px; font-weight: 700; }
  @keyframes pop { 40% { transform: scale(1.3) rotate(8deg); } }
  .entry-actions button.popping svg { animation: pop .35s ease; }

  .entry.gepostet h2, .entry.gepostet .d-text { opacity: .55; }
  .entry .d-text {
    grid-column: 1; white-space: pre-wrap; color: var(--text-2); font-size: 15px; line-height: 1.6;
    margin-top: 4px; cursor: pointer;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .entry .d-text.open { display: block; -webkit-line-clamp: none; }

  /* Schmale Karte (Handy, schmale Fenster): Aktionen unter den Text */
  @container (max-width: 560px) {
    .entry { grid-template-columns: minmax(0, 1fr); padding: 14px 8px 12px 16px; }
    .entry-actions { grid-column: 1; grid-row: auto; order: 9; opacity: 1; translate: 0 0; margin-top: 6px; }
  }

  /* ---------- Notiz & Resümee ---------- */
  .note-block, .res-block { grid-column: 1; margin-top: 8px; padding: 9px 14px; border-radius: 0 var(--r-md) var(--r-md) 0; }
  .note-block { cursor: pointer; background: var(--amber-soft); border-inline-start: 2px solid var(--amber); transition: background-color var(--t); }
  .note-block:hover { background: color-mix(in oklch, var(--amber) 22%, transparent); }
  .note-label, .res-label { font-size: 12px; font-weight: 700; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
  .note-label { color: var(--amber); }
  .note-text, .res-text { font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
  .note-text { color: var(--text); }
  .note-editor { grid-column: 1; margin-top: 9px; }
  .note-editor textarea, .pruef-anweisung {
    inline-size: 100%; min-block-size: 76px; padding: 10px 13px; resize: vertical;
    border: 0; border-radius: var(--r-md); background: var(--surface-2); box-shadow: var(--inset-well);
    color: var(--text); font: inherit; font-size: 14px; line-height: 1.55;
  }
  .note-editor textarea:focus, .pruef-anweisung:focus { outline: 2px solid color-mix(in oklch, var(--accent-text) 60%, transparent); outline-offset: 0; }
  .note-editor .row { display: flex; gap: 8px; margin-top: 8px; }
  .res-block { background: color-mix(in oklch, var(--text) 4%, transparent); border-inline-start: 2px solid var(--line); }
  .res-block.hoch { background: var(--gruen-soft); border-inline-start-color: var(--gruen); }
  .res-block.mittel { background: var(--amber-soft); border-inline-start-color: var(--amber); }
  .res-label { color: var(--text-2); }
  .res-dot { inline-size: 8px; aspect-ratio: 1; border-radius: 50%; background: var(--text-3); }
  .res-block.hoch .res-dot { background: var(--gruen); }
  .res-block.hoch .res-label { color: var(--gruen); }
  .res-block.mittel .res-dot { background: var(--amber); }
  .res-block.mittel .res-label { color: var(--amber); }
  .res-text { color: var(--text-2); }
  .res-loading, .vw-dots { display: flex; gap: 6px; padding: 4px 0; }
  .res-loading span, .vw-dots span { inline-size: 7px; aspect-ratio: 1; border-radius: 50%; background: var(--accent-text); animation: vwpulse 1.2s infinite; }
  .res-loading span:nth-child(2), .vw-dots span:nth-child(2) { animation-delay: .2s; }
  .res-loading span:nth-child(3), .vw-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes vwpulse { 0%, 100% { opacity: .25; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }

  /* ---------- Gruppen, Zustände, Leisten ---------- */
  .day-sep { display: flex; align-items: center; gap: 12px; padding: 18px 4px 4px; color: var(--text-3); font-size: 13px; font-weight: 700; }
  .day-sep:first-child { padding-top: 4px; }
  .day-sep::after { content: ""; flex: 1; block-size: 1px; background: var(--line); }
  .state { text-align: center; color: var(--text-2); padding: 60px 16px 40px; }
  .state .orn { font-family: var(--serif); font-style: italic; color: var(--text-3); font-size: 30px; display: block; margin-bottom: 10px; }
  .state .hint { color: var(--text-3); font-size: 14px; margin-top: 6px; }
  .more { align-self: center; margin-top: 14px; }
  .restore-bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px;
    border-radius: var(--r-lg); background: var(--amber-soft); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--amber) 40%, transparent);
    font-size: 14px; color: var(--text);
  }
  .restore-bar span { flex: 1; min-inline-size: 200px; }

  /* ---------- Knöpfe in Fenstern und Leisten (aus den Tokens des Standards) ---------- */
  .vw-btn {
    display: inline-flex; align-items: center; justify-content: center; height: 38px; padding: 0 16px;
    border: 0; border-radius: var(--r-pill); font-size: 14px; font-weight: 650; color: var(--text);
    background: linear-gradient(172deg, var(--sheen), transparent 60%), var(--surface);
    box-shadow: var(--depth), 0 1px 2px var(--drop-near);
    transition: transform var(--t-slow) var(--spring), box-shadow var(--t) var(--ease);
  }
  .vw-btn:active:not([disabled]) { transform: scale(.96); transition-duration: var(--t-fast); }
  .vw-btn.primary { background: var(--gel); color: var(--on-accent); box-shadow: var(--gel-depth), var(--glow); text-shadow: 0 1px 1px oklch(0 0 0 / .2); }
  .vw-btn[disabled] { opacity: .45; cursor: default; }

  /* ---------- Login ---------- */
  .login-overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; }
  .login-box { inline-size: min(360px, 100%); padding: 32px 28px 26px; border-radius: var(--r-xl); display: grid; gap: 6px; animation: enter .5s var(--ease) both; }
  .login-box .brand { padding: 0 0 6px; }
  .login-box .sub { color: var(--text-3); font-size: 13.5px; margin-bottom: 22px; }
  .login-box label { font-size: 13px; font-weight: 600; color: var(--text-2); }
  .login-box input {
    inline-size: 100%; block-size: 44px; padding: 0 14px; border: 0; border-radius: var(--r-md);
    background: var(--surface-2); box-shadow: var(--inset-well); font-size: 16px;
  }
  .login-box .btn { inline-size: 100%; justify-content: center; margin-top: 16px; }
  .login-error { color: var(--rot); font-size: 14px; margin-top: 10px; min-block-size: 20px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* ---------- Verwerten-Fenster ---------- */
  .vw-overlay {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px;
    background: oklch(0.15 0.02 260 / .45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .vw-panel {
    inline-size: min(640px, 100%); max-block-size: 88vh; display: flex; flex-direction: column;
    border-radius: var(--r-xl); color: var(--text);
    background: linear-gradient(172deg, var(--sheen), transparent 30%), var(--surface-solid);
    box-shadow: var(--depth), var(--shadow);
    animation: enter .3s var(--ease) both;
  }
  .vw-head { display: flex; align-items: center; gap: 10px; padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
  .vw-head h3 { font-family: var(--serif); font-size: 20px; font-weight: 700; flex: 1; }
  .vw-body { padding: 20px 22px; overflow-y: auto; flex: 1; }
  .vw-quelle { color: var(--text-3); font-size: 13px; margin-bottom: 12px; }
  .vw-loading { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 40px 0; color: var(--text-2); font-size: 14px; }
  .vw-loading .vw-dots span { inline-size: 9px; }
  .vw-error { color: var(--rot); font-size: 14px; padding: 30px 0; text-align: center; }
  .vw-foot { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 22px 18px; border-top: 1px solid var(--line); }
  .vw-format { display: inline-flex; gap: 2px; padding: 3px; margin: -2px 0 14px; border-radius: var(--r-pill); background: var(--surface-2); box-shadow: var(--inset-well); }
  .format-chip { border: 0; background: none; padding: 5px 12px; border-radius: var(--r-pill); font-size: 13px; font-weight: 650; color: var(--text-2); }
  .format-chip.active { background: linear-gradient(172deg, var(--sheen), transparent 70%), var(--surface-solid); color: var(--text); box-shadow: var(--depth), 0 2px 6px -2px var(--drop-far); }
  textarea.vw-draft {
    display: block; inline-size: 100%; border: 0; background: transparent; padding: 0; margin: 0;
    font: inherit; font-size: 15.5px; line-height: 1.65; color: var(--text);
    resize: none; outline: none; overflow: hidden; min-block-size: 100px; border-radius: 6px; user-select: text;
  }
  textarea.vw-draft:focus { box-shadow: -14px 0 0 -12px var(--accent-text); }

  /* Prüfstand */
  .pruef-zone { margin-top: 22px; border-top: 1px dashed var(--line); padding-top: 18px; }
  .pruef-titel { font-size: 13px; font-weight: 700; color: var(--text-3); margin-bottom: 12px; }
  .pruef-karten { display: flex; flex-direction: column; gap: 12px; }
  .pruef-karte { border-radius: var(--r-lg); overflow: hidden; background: color-mix(in oklch, var(--text) 3%, transparent); box-shadow: var(--depth); }
  .pruef-kopf { display: flex; align-items: center; gap: 11px; padding: 11px 14px; flex-wrap: wrap; }
  .pruef-avatar { inline-size: 34px; aspect-ratio: 1; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--serif); font-weight: 700; font-size: 15px; color: oklch(0.99 0 0); box-shadow: inset 0 1px 1px oklch(1 0 0 / .4); }
  .pruef-avatar.ronny { background: linear-gradient(135deg, oklch(0.62 0.08 255), oklch(0.45 0.08 255)); }
  .pruef-avatar.claudia { background: linear-gradient(135deg, oklch(0.66 0.09 350), oklch(0.50 0.09 350)); }
  .pruef-avatar.markus { background: linear-gradient(135deg, oklch(0.68 0.08 160), oklch(0.52 0.08 160)); }
  .pruef-wer { flex: 1; min-inline-size: 0; }
  .pruef-name { font-size: 14.5px; font-weight: 650; }
  .pruef-rolle { font-size: 12.5px; color: var(--text-3); }
  .pruef-score { font-family: var(--serif); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; padding: 2px 10px; border-radius: var(--r-sm); }
  .pruef-start { font-size: 13px; font-weight: 700; color: var(--text-2); padding: 5px 12px; border: 0; border-radius: var(--r-pill); background: var(--surface-2); box-shadow: var(--inset-well); }
  .pruef-start:hover { color: var(--text); }
  .pruef-feedback { padding: 12px 15px; font-size: 14px; line-height: 1.6; color: var(--text-2); white-space: pre-wrap; border-top: 1px solid var(--line); max-block-size: 320px; overflow-y: auto; }
  .pruef-mini { display: inline-flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 13px; padding: 8px 14px; }
  .pruef-mini .vw-dots span { inline-size: 6px; }
  .pruef-fehler { padding: 10px 15px; color: var(--rot); font-size: 13.5px; border-top: 1px solid var(--line); }
  .pruef-check { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); cursor: pointer; white-space: nowrap; user-select: none; }
  .pruef-check input { accent-color: var(--accent); inline-size: 15px; block-size: 15px; margin: 0; cursor: pointer; }
  .pruef-anweisung { margin-top: 14px; min-block-size: 54px; font-size: 13.5px; }
  .pruef-anweisung::placeholder { color: var(--text-3); }
  @media (min-width: 1000px) {
    .vw-panel.breit { inline-size: min(1160px, 100%); }
    .vw-body.two-col { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 0 30px; align-items: start; }
    .vw-body.two-col .pruef-zone { border-top: 0; margin-top: 0; padding-top: 0; border-inline-start: 1px dashed var(--line); padding-inline-start: 30px; min-block-size: 100%; }
    .vw-body.two-col .pruef-feedback { max-block-size: 260px; }
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 60; max-inline-size: min(90vw, 480px);
    translate: -50% 10px; opacity: 0; pointer-events: none;
    padding: 11px 18px; border-radius: var(--r-lg); font-size: 14px; color: var(--text);
    background: linear-gradient(172deg, var(--sheen), transparent 40%), var(--surface-solid);
    box-shadow: var(--depth), var(--shadow);
    transition: opacity .25s var(--ease), translate .25s var(--ease);
  }
  #toast.show { opacity: 1; translate: -50% 0; }

  /* ---------- Mobil ---------- */
  @media (max-width: 760px) {
    .mobile-only { display: grid; }
    .side-foot { display: none; }
    #toast { bottom: calc(96px + env(safe-area-inset-bottom)); }
    .lage .card { grid-column: 1 / -1; }
    .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .kpi { padding: 10px; }
    .kpi strong { font-size: 21px; }
    .liste-card { padding-inline: 12px; }
    .vw-overlay { padding: 10px; }
    .vw-head, .vw-body, .vw-foot { padding-inline: 16px; }
    /* Profilmenü hat am Handy keinen Anker in der (ausgeblendeten) Sidebar */
    .menu { position: fixed; inset: 72px 12px auto auto; position-area: none; margin: 0; }
  }
</style>
</head>

<script>
"use strict";

/* ---------- Icons (statische Strings, nur in Buttons injiziert) ---------- */
const ICONS = {
  star: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.8L12 16.9l-5.3 2.7 1.1-5.8-4.3-4.1 5.9-.8z"/></svg>',
  starFill: '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.8L12 16.9l-5.3 2.7 1.1-5.8-4.3-4.1 5.9-.8z"/></svg>',
  archive: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4.5" rx="1"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5"/><path d="M10 12.5h4"/></svg>',
  restore: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l4-5h10l4 5"/><path d="M3 9h18v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M12 17v-5"/><path d="m9.5 14.5 2.5-2.5 2.5 2.5"/></svg>',
  trash: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a1 1 0 0 0 1 .9h8a1 1 0 0 0 1-.9L18 7"/><path d="M10 11v6M14 11v6"/></svg>',
  quill: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4c-5 0-11 2.5-13.5 8L4 20l1.5-.5C13 17 17 12 20 4z"/><path d="M9.5 14.5 4 20"/></svg>',
  note: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14a1 1 0 0 1 1 1v9l-6 6H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 20v-5a1 1 0 0 1 1-1h5"/></svg>',
  gauge: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8" fill="currentColor"/></svg>',
  copy: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
  check: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5.5"/></svg>',
  open: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h5v5"/><path d="M20 4 11 13"/><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></svg>'
};

const state = {
  tab: "new", kind: "", q: "", offset: 0, limit: 50,
  items: [], drafts: [], counts: { new: 0, important: 0, archived: 0, drafts: 0 },
  mayHaveMore: false, initialRender: true
};

const $ = (id) => document.getElementById(id);
const listEl = $("list"), stateBox = $("stateBox"), moreBtn = $("moreBtn");

/* ---------- API ---------- */
async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (res.status === 401) { showLogin(); throw new Error("nicht angemeldet"); }
  let body = null;
  try { body = await res.json(); } catch { /* leer */ }
  if (!res.ok) throw new Error((body && body.detail) || ("Fehler " + res.status));
  return body;
}

/* ---------- Login ---------- */
function showLogin() {
  $("loginOverlay").hidden = false;
  $("appWrap").hidden = true;
  setTimeout(() => $("pw").focus(), 60);
}
function showApp() {
  $("loginOverlay").hidden = true;
  $("appWrap").hidden = false;
}

$("loginForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = $("loginBtn"), err = $("loginError");
  err.textContent = ""; btn.disabled = true;
  try {
    await api("/api/login", { method: "POST", body: JSON.stringify({ password: $("pw").value }) });
    $("pw").value = "";
    showApp();
    await load(true);
    checkAutosave();
  } catch (e) {
    err.textContent = e.message === "nicht angemeldet" ? "Falsches Passwort" : e.message;
    const box = document.querySelector(".login-box");
    box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
  } finally {
    btn.disabled = false;
  }
});

document.querySelectorAll("#profilMenu button").forEach(b => b.addEventListener("click", () => {
  try { $("profilMenu").hidePopover(); } catch { /* bereits zu */ }
}));

$("logoutBtn").addEventListener("click", async () => {
  try { await api("/api/logout", { method: "POST" }); } catch { /* egal */ }
  state.items = []; listEl.textContent = "";
  showLogin();
});

/* ---------- Laden & Rendern ---------- */
async function load(reset) {
  if (state.tab === "drafts") {
    const data = await api("/api/drafts");
    state.drafts = data.items;
    try { state.experiment = await api("/api/experiment"); } catch { state.experiment = null; }
    state.counts = data.counts;
    state.mayHaveMore = false;
    render();
    state.initialRender = false;
    return;
  }
  if (reset) { state.offset = 0; state.items = []; }
  const params = new URLSearchParams({ tab: state.tab, limit: state.limit, offset: state.offset });
  if (state.q) params.set("q", state.q);
  if (state.kind) params.set("kind", state.kind);
  const data = await api("/api/items?" + params);
  state.items = state.offset === 0 ? data.items : state.items.concat(data.items);
  state.counts = data.counts;
  state.mayHaveMore = data.items.length === state.limit;
  render();
  state.initialRender = false;
}

const LISTE_KOPF = {
  new: ["Neu", "Posteingang des Themenscouts"],
  important: ["Wichtig", "Mit Stern markiert, auch wenn archiviert"],
  archived: ["Archiv", "Erledigte Funde, weiterhin durchsuchbar"],
  drafts: ["Entwürfe", "Gespeicherte LinkedIn-Entwürfe mit Prüfer-Noten"]
};

function render() {
  render_counts_only();
  const [titel, unter] = LISTE_KOPF[state.tab];
  $("listeTitel").textContent = state.q ? "Suche: „" + state.q + "“" : titel;
  $("listeUnter").textContent = state.q ? unter + " · Esc leert die Suche" : unter;
  document.querySelectorAll(".tab").forEach(t => {
    const active = t.dataset.tab === state.tab;
    t.classList.toggle("active", active);
    t.setAttribute("aria-selected", String(active));
  });
  document.querySelectorAll(".kind-chip").forEach(c => {
    c.classList.toggle("active", c.dataset.kind === state.kind);
  });
  document.querySelector(".kinds").hidden = state.tab === "drafts";

  renderBriefing();

  listEl.textContent = "";
  if (state.tab === "drafts") { renderDrafts(); return; }
  let lastLabel = null;
  state.items.forEach((item, i) => {
    // Gruppierung nach Eingang — konsistent mit Sortierung und Tagesbriefing
    const label = dayLabel(item.ingested_at);
    if (label !== lastLabel) {
      listEl.appendChild(el("li", "day-sep", label));
      lastLabel = label;
    }
    listEl.appendChild(entryNode(item, i));
  });

  if (state.items.length === 0) {
    stateBox.hidden = false;
    stateBox.textContent = "";
    stateBox.append(el("span", "orn", "⁂"), el("div", "", emptyText()), el("div", "hint", emptyHint()));
  } else {
    stateBox.hidden = true;
  }
  moreBtn.hidden = !state.mayHaveMore;
}

function dayLabel(iso) {
  const d = new Date(iso), now = new Date();
  if (isNaN(d)) return "Ohne Datum";
  if (d.toDateString() === now.toDateString()) return "Heute";
  const gestern = new Date(now); gestern.setDate(now.getDate() - 1);
  if (d.toDateString() === gestern.toDateString()) return "Gestern";
  return d.toLocaleDateString("de-DE", { day: "numeric", month: "long" });
}

function erschienenText(item) {
  // Erscheinungsdatum nur zeigen, wenn es von Eingangstag abweicht
  if (!item.published_at) return "";
  const p = new Date(item.published_at), i = new Date(item.ingested_at);
  if (isNaN(p) || isNaN(i) || p.toDateString() === i.toDateString()) return "";
  const opts = { day: "numeric", month: "long" };
  if (p.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return "erschienen " + p.toLocaleDateString("de-DE", opts);
}

function renderBriefing() {
  const box = $("briefing");
  box.textContent = "";
  if (state.tab !== "new" || state.q || state.kind) return;
  const heute = state.items.filter(it => {
    const d = new Date(it.ingested_at);
    return !isNaN(d) && d.toDateString() === new Date().toDateString();
  });
  if (!heute.length) return;
  const kinds = { news: 0, idee: 0, zitat: 0 };
  const pillars = {};
  heute.forEach(it => {
    kinds[it.kind] = (kinds[it.kind] || 0) + 1;
    if (it.pillar) pillars[it.pillar] = (pillars[it.pillar] || 0) + 1;
  });
  const teile = [];
  if (kinds.news) teile.push(kinds.news + (kinds.news === 1 ? " Meldung" : " Meldungen"));
  if (kinds.idee) teile.push(kinds.idee + (kinds.idee === 1 ? " Content-Idee" : " Content-Ideen"));
  if (kinds.zitat) teile.push(kinds.zitat + (kinds.zitat === 1 ? " Zitat" : " Zitate"));
  const top = Object.keys(pillars).length > 0;

  // Karte 1: was heute kam, als Zahl plus Zusammensetzung
  const card = lageKarte("Heute geliefert", "Was der Themenscout seit Mitternacht gebracht hat");
  const zahl = el("div", "b-zahl num");
  zahl.append(el("strong", "", String(heute.length)), el("span", "", heute.length === 1 ? "Fundstück" : "Fundstücke"));
  card.append(zahl);
  const mix = el("div", "mix");
  mix.setAttribute("role", "img");
  mix.setAttribute("aria-label", teile.join(", "));
  const legende = el("div", "mix-legende");
  [["news", "Meldung", "Meldungen"], ["idee", "Content-Idee", "Content-Ideen"], ["zitat", "Zitat", "Zitate"]].forEach(([k, eins, viele]) => {
    if (!kinds[k]) return;
    const teil = el("i", k); teil.style.setProperty("--n", kinds[k]);
    mix.append(teil);
    const l = el("span"); const sw = el("i", k);
    l.append(sw, document.createTextNode(kinds[k] + " " + (kinds[k] === 1 ? eins : viele)));
    legende.append(l);
  });
  card.append(mix, legende);
  if (state.counts.dienst_heute > 0) {
    card.append(el("div", "b-hinweis",
      "Prüfdienst: " + state.counts.dienst_heute +
      (state.counts.dienst_heute === 1 ? " externer Aufruf" : " externe Aufrufe") + " heute"));
  }
  box.append(card);

  // Karte 2: Schwerpunkte (Säulen) des Tages, nur wenn der Scout welche gesetzt hat
  if (top) {
    const sk = lageKarte("Schwerpunkte", "Säulen der heutigen Funde");
    const rows = el("div", "shares");
    Object.entries(pillars).sort((a, b) => b[1] - a[1]).slice(0, 4).forEach(([p, c]) => {
      const row = el("div", "share");
      const name = el("span"); name.append(el("b", "", p));
      const bar = el("div", "bar"); const fill = el("i"); fill.style.setProperty("--p", Math.round(c / heute.length * 100)); bar.append(fill);
      row.append(name, bar, el("span", "pct num", String(c)));
      rows.append(row);
    });
    sk.append(rows);
    box.append(sk);
  }
}

function lageKarte(titel, unter) {
  const card = el("article", "card glass");
  const head = el("div", "card-head");
  const txt = el("div");
  txt.append(el("h2", "", titel), el("p", "", unter));
  head.append(txt);
  card.append(head);
  return card;
}

function emptyText() {
  if (state.q) return "Keine Treffer für „" + state.q + "“.";
  if (state.kind === "idee") return "Keine Content-Ideen in dieser Ansicht.";
  if (state.kind === "zitat") return "Keine Zitate in dieser Ansicht.";
  if (state.kind === "news") return "Keine News in dieser Ansicht.";
  return { new: "Keine neuen Meldungen.", important: "Nichts als wichtig markiert.",
           archived: "Das Archiv ist leer." }[state.tab];
}
function emptyHint() {
  if (state.q) return "Suchbegriff anpassen oder mit Esc leeren.";
  return { new: "Der Themenscout liefert täglich um 06:30 — was Neues landet automatisch hier.",
           important: "Der Stern an einer Meldung legt sie hier ab.",
           archived: "Archivierte Meldungen bleiben durchsuchbar." }[state.tab];
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function entryNode(item, index) {
  const li = el("li", "entry" + (item.important ? " important" : ""));
  if (state.initialRender) li.style.animationDelay = Math.min(index, 12) * 40 + "ms";
  else li.style.animation = "none";

  const meta = el("div", "meta");
  if (item.source) meta.append(el("span", "source", item.source), el("span", "sep", "·"));
  const t = el("span", "time", relTime(item.ingested_at));
  t.title = "Eingegangen: " + absTime(item.ingested_at);
  meta.append(t);
  const ersch = erschienenText(item);
  if (ersch) {
    const e = el("span", "time", ersch);
    e.title = "Erscheinungsdatum des Originals: " + absTime(item.published_at);
    meta.append(el("span", "sep", "·"), e);
  }
  if (item.kind === "idee") meta.append(el("span", "chip idee", "Content-Idee"));
  if (item.kind === "zitat") meta.append(el("span", "chip zitat", "Zitat"));
  if (item.pillar) meta.append(el("span", "chip pillar", item.pillar));
  if (state.tab === "important" && item.status === "archived") meta.append(el("span", "chip archiviert", "archiviert"));
  if (item.verwertet) {
    const vc = el("span", "chip " + (item.verwertet === "gepostet" ? "gepostet" : "verwertet"),
                  item.verwertet === "gepostet" ? "gepostet" : "verwertet");
    vc.title = "Zum gespeicherten Entwurf springen";
    vc.style.cursor = "pointer";
    vc.addEventListener("click", () => {
      state.tab = "drafts";
      state.q = item.title;
      $("searchInput").value = item.title;
      state.initialRender = true;
      load(true).catch(e => toast(e.message));
    });
    meta.append(vc);
  }

  const h2 = el("h2");
  // Nur echte externe Quellen verlinken — Platzhalter-URLs (eigene Domain,
  // ungültige URLs) werden als reiner Text gezeigt statt ins Leere zu führen.
  let extern = false;
  try { extern = new URL(item.url, location.href).origin !== location.origin; } catch { extern = false; }
  if (extern) {
    const a = el("a", "", item.title);
    a.href = item.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    h2.append(a);
  } else {
    h2.append(el("span", "", item.title));
  }

  const actions = el("div", "entry-actions");
  actions.append(
    iconBtn(ICONS.quill, "Verwerten: LinkedIn-Entwurf erstellen", "", () => verwerten(item)),
    iconBtn(ICONS.gauge, item.assessment ? "Resümee neu bewerten" : "Einordnen: Relevanz für Geschäft & IT-Leiter",
            "", () => einordnen(item, li)),
    iconBtn(item.important ? ICONS.starFill : ICONS.star,
            item.important ? "Wichtig-Markierung entfernen" : "Als wichtig markieren",
            "star-btn" + (item.important ? " star-on" : ""),
            () => toggleImportant(item, li)),
    iconBtn(ICONS.note, item.note ? "Notiz bearbeiten" : "Notiz hinzufügen",
            "note-btn" + (item.note ? " note-on" : ""),
            () => noteEditor(item, li)),
    iconBtn(item.status === "archived" ? ICONS.restore : ICONS.archive,
            item.status === "archived" ? "Wiederherstellen" : "Archivieren", "",
            () => toggleArchive(item, li)),
    trashBtn(item, li)
  );

  li.append(meta, h2, actions);
  if (item.summary) {
    li.append(el("p", "summary" + (item.kind === "zitat" ? " zitat" : ""), item.summary));
  }
  if (item.assessment) {
    li.append(resBlock(item));
  }
  if (item.note) {
    const nb = el("div", "note-block");
    nb.title = "Klicken zum Bearbeiten";
    nb.append(el("div", "note-label", "Meine Notiz"), el("div", "note-text", item.note));
    nb.addEventListener("click", () => noteEditor(item, li));
    li.append(nb);
  }
  return li;
}

/* ---------- Resümee (KI-Einordnung) ---------- */
const REL_LABEL = { hoch: "Relevanz hoch", mittel: "Relevanz mittel", gering: "Relevanz gering" };

function resBlock(item) {
  const rb = el("div", "res-block " + (item.relevance || ""));
  const label = el("div", "res-label");
  label.append(el("span", "res-dot"), el("span", "", "Resümee · " + (REL_LABEL[item.relevance] || "bewertet")));
  rb.append(label, el("div", "res-text", item.assessment));
  return rb;
}

async function einordnen(item, li) {
  let rb = li.querySelector(".res-block");
  if (!rb) {
    rb = el("div", "res-block");
    const nb = li.querySelector(".note-block");
    if (nb) li.insertBefore(rb, nb); else li.append(rb);
  }
  rb.className = "res-block";
  rb.textContent = "";
  const lade = el("div", "res-loading");
  lade.append(el("span"), el("span"), el("span"));
  rb.append(el("div", "res-label", "Resümee entsteht …"), lade);
  try {
    const updated = await api("/api/items/" + item.id + "/einordnen", { method: "POST" });
    Object.assign(item, updated);
    rb.replaceWith(resBlock(item));
  } catch (e) {
    rb.remove();
    if (item.assessment) li.insertBefore(resBlock(item), li.querySelector(".note-block"));
    toast(e.message);
  }
}

/* ---------- Notiz-Editor ---------- */
function noteEditor(item, li) {
  if (li.querySelector(".note-editor")) return;
  const nb = li.querySelector(".note-block");
  if (nb) nb.remove();
  const ed = el("div", "note-editor");
  const ta = document.createElement("textarea");
  ta.value = item.note || "";
  ta.placeholder = "Dein Winkel zu diesem Fund — fließt beim Verwerten in den Entwurf ein. (Leer speichern entfernt die Notiz.)";
  ta.maxLength = 5000;
  const row = el("div", "row");
  const save = el("button", "vw-btn primary", "Speichern"); save.type = "button";
  const cancel = el("button", "vw-btn", "Abbrechen"); cancel.type = "button";
  row.append(save, cancel);
  ed.append(ta, row);
  li.append(ed);
  ta.focus();
  cancel.addEventListener("click", () => li.replaceWith(entryNode(item, 0)));
  save.addEventListener("click", async () => {
    save.disabled = true;
    try {
      const updated = await api("/api/items/" + item.id, { method: "PATCH", body: JSON.stringify({ note: ta.value }) });
      Object.assign(item, updated);
      li.replaceWith(entryNode(item, 0));
      toast(item.note ? "Notiz gespeichert." : "Notiz entfernt.");
    } catch (e) {
      toast(e.message);
      save.disabled = false;
    }
  });
}

function iconBtn(svg, label, cls, onClick) {
  const b = el("button", cls || "");
  b.type = "button"; b.innerHTML = svg;
  b.title = label; b.setAttribute("aria-label", label);
  b.addEventListener("click", onClick);
  return b;
}

function trashBtn(item, li) {
  const b = iconBtn(ICONS.trash, "Löschen", "", () => {
    if (!b.classList.contains("confirm")) {
      b.classList.add("confirm"); b.textContent = "Löschen?";
      setTimeout(() => { if (b.isConnected && b.classList.contains("confirm")) {
        b.classList.remove("confirm"); b.textContent = ""; b.innerHTML = ICONS.trash;
      } }, 2600);
    } else {
      removeItem(item, li);
    }
  });
  return b;
}

/* ---------- Aktionen ---------- */
async function toggleImportant(item, li) {
  const target = !item.important;
  try {
    const updated = await api("/api/items/" + item.id, { method: "PATCH", body: JSON.stringify({ important: target }) });
    Object.assign(item, updated);
    state.counts.important += target ? 1 : -1;
    if (state.tab === "important" && !target) return removeRow(item, li);
    li.classList.toggle("important", item.important);
    const btn = li.querySelector(".entry-actions .star-btn");
    btn.classList.toggle("star-on", item.important);
    btn.innerHTML = item.important ? ICONS.starFill : ICONS.star;
    btn.title = btn.ariaLabel = item.important ? "Wichtig-Markierung entfernen" : "Als wichtig markieren";
    btn.classList.add("popping"); setTimeout(() => btn.classList.remove("popping"), 380);
    render_counts_only();
  } catch (e) { toast(e.message); }
}

async function toggleArchive(item, li) {
  const target = item.status === "archived" ? "new" : "archived";
  try {
    const updated = await api("/api/items/" + item.id, { method: "PATCH", body: JSON.stringify({ status: target }) });
    Object.assign(item, updated);
    state.counts.new += target === "archived" ? -1 : 1;
    state.counts.archived += target === "archived" ? 1 : -1;
    if (state.tab !== "important") return removeRow(item, li);
    render();
  } catch (e) { toast(e.message); }
}

async function removeItem(item, li) {
  try {
    await api("/api/items/" + item.id, { method: "DELETE" });
    if (item.status === "new") state.counts.new -= 1;
    if (item.status === "archived") state.counts.archived -= 1;
    if (item.important) state.counts.important -= 1;
    removeRow(item, li);
  } catch (e) { toast(e.message); }
}

function removeRow(item, li) {
  state.items = state.items.filter(x => x.id !== item.id);
  li.classList.add("leaving");
  setTimeout(() => {
    state.initialRender = false;
    render();
    if (state.items.length === 0 && state.mayHaveMore) load(true).catch(e => toast(e.message));
  }, 280);
}

function render_counts_only() {
  for (const key of ["new", "important", "archived", "drafts"]) {
    $("count-" + key).textContent = state.counts[key] > 0 ? String(state.counts[key]) : "";
    $("kpi-" + key).textContent = String(state.counts[key] || 0);
  }
  const teile = [];
  if (state.counts.new) teile.push(state.counts.new + (state.counts.new === 1 ? " neuer Fund" : " neue Funde"));
  if (state.counts.important) teile.push(state.counts.important + " wichtig");
  $("today").textContent = new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" })
    + (teile.length ? " · " + teile.join(", ") : "");
}

/* ---------- Entwürfe-Tab ---------- */
function renderExperiment() {
  const box = $("briefing");
  box.textContent = "";
  const ex = state.experiment && state.experiment.arme;
  if (!ex || !Object.values(ex).some(a => a.entwuerfe > 0)) return;
  Object.values(ex).forEach(a => {
    const card = lageKarte("Format-Experiment: " + a.label, "Seit " + state.experiment.seit + " · Mediane aus dem ContentIn-Rückkanal");
    const z = el("div", "arm-zahlen");
    [[a.entwuerfe, a.entwuerfe === 1 ? "Entwurf" : "Entwürfe"], [a.gepostet, "gepostet"], [a.gemessen, "gemessen"]].forEach(([n, l]) => {
      const d = el("div"); d.append(el("strong", "num", String(n)), el("span", "", l)); z.append(d);
    });
    card.append(z);
    const m = el("div", "meter");
    const top = el("div", "meter-top");
    top.append(el("span", "", "Gepostet"), el("b", "num", a.gepostet + " von " + a.entwuerfe));
    const bar = el("div", "bar"); const fill = el("i");
    fill.style.setProperty("--p", a.entwuerfe ? Math.round(a.gepostet / a.entwuerfe * 100) : 0);
    bar.append(fill); m.append(top, bar); card.append(m);
    card.append(el("div", "arm-median", a.gemessen > 0
      ? "Impressionen " + a.impressionen_median + " · Likes " + a.likes_median + " · " + a.kommentare_je_post
        + " Komm./Post · " + a.engagement_median + " % · " + a.mit_kommentar + " mit Kommentar"
      : "Noch keine Kennzahlen gemessen. Ablauf und Entscheidungsregel: docs/format-experiment.md"));
    box.append(card);
  });
}

function renderDrafts() {
  renderExperiment();
  const q = state.q.toLowerCase();
  const list = state.drafts.filter(d =>
    !q || d.text.toLowerCase().includes(q) || (d.item_title || "").toLowerCase().includes(q));
  let lastLabel = null;
  list.forEach((d, i) => {
    const label = dayLabel(d.updated_at);
    if (label !== lastLabel) {
      listEl.appendChild(el("li", "day-sep", label));
      lastLabel = label;
    }
    listEl.appendChild(draftNode(d, i));
  });
  if (list.length === 0) {
    stateBox.hidden = false;
    stateBox.textContent = "";
    stateBox.append(el("span", "orn", "⁂"),
      el("div", "", q ? "Keine Entwürfe zu „" + state.q + "“." : "Noch keine gespeicherten Entwürfe."),
      el("div", "hint", q ? "Suchbegriff anpassen oder mit Esc leeren."
                          : "Im LinkedIn-Fenster „Speichern“ klicken — dann landet der Entwurf hier."));
  } else {
    stateBox.hidden = true;
  }
  moreBtn.hidden = true;
}

function draftTitel(text) {
  const zeile = (text || "").split("\n").map(z => z.trim()).find(z => z) || "Entwurf";
  return zeile.length > 110 ? zeile.slice(0, 110) + "…" : zeile;
}

function draftNode(d, index) {
  const li = el("li", "entry" + (d.status === "gepostet" ? " gepostet" : ""));
  if (state.initialRender) li.style.animationDelay = Math.min(index, 12) * 40 + "ms";
  else li.style.animation = "none";

  const meta = el("div", "meta");
  meta.append(el("span", "source", d.item_title || "Freier Entwurf"), el("span", "sep", "·"));
  const t = el("span", "time", relTime(d.updated_at));
  t.title = absTime(d.updated_at);
  meta.append(t);
  if (d.status === "gepostet") meta.append(el("span", "chip gepostet", "gepostet"));
  if (FORMAT_LABEL[d.format]) meta.append(el("span", "chip format", FORMAT_LABEL[d.format]));
  (d.scores || []).forEach(s => {
    if (s.score !== null && s.score !== undefined) {
      const badge = el("span", "d-score " + scoreKlasse(s.score),
        ((s.name || "?").split(" ")[0]) + " " + s.score);
      if (Array.isArray(s.dimensionen) && s.dimensionen.length) {
        badge.title = s.dimensionen.map(t => t.name + " " + t.score).join(" · ");
      }
      meta.append(badge);
    }
  });

  if (d.kennzahlen) {
    const k = d.kennzahlen;
    const kz = el("span", "time", "LinkedIn: " + k.impressions + " Impr. · " + k.likes + " Likes · " + k.comments + " Komm.");
    kz.title = "Stand " + (k.gemessen_am ? absTime(k.gemessen_am) : "unbekannt")
      + (d.veroeffentlicht_am ? " · veröffentlicht " + absTime(d.veroeffentlicht_am) : "");
    meta.append(el("span", "sep", "·"), kz);
  }

  const h2 = el("h2");
  h2.append(el("span", "", draftTitel(d.text)));

  const actions = el("div", "entry-actions");
  actions.append(
    iconBtn(ICONS.open, "Öffnen: bearbeiten, prüfen lassen, überarbeiten", "", () => openDraft(d)),
    iconBtn(ICONS.copy, "Text kopieren", "", async () => {
      try { await navigator.clipboard.writeText(d.text); toast("Entwurf kopiert — ab damit zu LinkedIn."); }
      catch { toast("Kopieren fehlgeschlagen — Text bitte manuell markieren."); }
    }),
    iconBtn(ICONS.check, d.status === "gepostet" ? "Zurück auf „Entwurf“ setzen" : "Als gepostet markieren",
            d.status === "gepostet" ? "check-on" : "", () => toggleGepostet(d, li)),
    draftTrashBtn(d, li)
  );

  const text = el("p", "d-text", d.text);
  text.title = "Klicken zum Auf- und Zuklappen";
  text.addEventListener("click", () => text.classList.toggle("open"));

  li.append(meta, h2, actions, text);
  return li;
}

async function toggleGepostet(d, li) {
  const target = d.status === "gepostet" ? "entwurf" : "gepostet";
  try {
    const updated = await api("/api/drafts/" + d.id, { method: "PATCH", body: JSON.stringify({ status: target }) });
    Object.assign(d, updated);
    state.initialRender = false;
    li.replaceWith(draftNode(d, 0));
    if (updated.item_archiviert) {
      state.counts.new = Math.max(0, (state.counts.new || 0) - 1);
      state.counts.archived = (state.counts.archived || 0) + 1;
      render_counts_only();
      toast("Als gepostet markiert — der zugehörige Fund wurde archiviert.");
    } else {
      toast(target === "gepostet" ? "Als gepostet markiert." : "Zurück auf „Entwurf“.");
    }
  } catch (e) { toast(e.message); }
}

function draftTrashBtn(d, li) {
  const b = iconBtn(ICONS.trash, "Löschen", "", async () => {
    if (!b.classList.contains("confirm")) {
      b.classList.add("confirm"); b.textContent = "Löschen?";
      setTimeout(() => { if (b.isConnected && b.classList.contains("confirm")) {
        b.classList.remove("confirm"); b.textContent = ""; b.innerHTML = ICONS.trash;
      } }, 2600);
    } else {
      try {
        await api("/api/drafts/" + d.id, { method: "DELETE" });
        state.drafts = state.drafts.filter(x => x.id !== d.id);
        state.counts.drafts = Math.max(0, (state.counts.drafts || 0) - 1);
        li.classList.add("leaving");
        setTimeout(() => { state.initialRender = false; render(); }, 280);
      } catch (e) { toast(e.message); }
    }
  });
  return b;
}

function openDraft(d) {
  vw.item = null;
  vw.draftId = d.id;
  vw.quelleText = d.item_title ? "Grundlage: " + d.item_title : "Freier Entwurf";
  vw.anweisung = "";
  vw.gesichert = d.text;  // unverändertes Schließen braucht keine Nachfrage
  if (FORMAT_LABEL[d.format]) vw.format = d.format;
  vwShow();
  renderDraft(d.text);
}

             quelleText: "", anweisung: "", laufend: false, stoppen: false, gesichert: null,
             format: "lehrstueck" };

];
const FORMAT_LABEL = Object.fromEntries(FORMATE.map(f => [f.key, f.label]));
try { if (FORMAT_LABEL[localStorage.getItem("cockpit_format")]) vw.format = localStorage.getItem("cockpit_format"); } catch { /* egal */ }

function vwShow() { $("vwOverlay").hidden = false; }
function vwHide() {
  $("vwOverlay").hidden = true;
  vw.item = null; vw.draft = ""; vw.results = {}; vw.include = {};
  vw.draftId = null; vw.quelleText = ""; vw.anweisung = ""; vw.gesichert = null;

}

function vwLoading(text) {
  const body = $("vwBody");
  body.textContent = "";
  body.classList.remove("two-col");
  const box = el("div", "vw-loading");
  const dots = el("div", "vw-dots");
  dots.append(el("span"), el("span"), el("span"));
  box.append(dots, el("div", "", text || "Entwurf entsteht — dauert einen Moment …"));
  body.append(box);
  $("vwCopy").disabled = true;
  $("vwRetry").disabled = true;
  $("vwRevise").disabled = true;
  $("vwSave").disabled = true;
  $("vwLoop").disabled = true;
}

function vwQuelleZeile(item) {
  const teile = [];
  if (item.kind === "idee") teile.push("Content-Idee");
  else if (item.kind === "zitat") teile.push("Zitat");
  else teile.push("Meldung");
  if (item.pillar) teile.push(item.pillar);
  if (item.source) teile.push(item.source);
  return "Grundlage: " + teile.join(" · ");
}

const PRUEFER_LISTE = [

  { key: "markus", name: "Markus Leitner", rolle: "Head of IT, Mittelstand — erste 100 Tage", initial: "M" }
];

function formatWechseln(key) {
  if (vw.laufend || !FORMAT_LABEL[key] || key === vw.format) return;
  vw.format = key;
  try { localStorage.setItem("cockpit_format", key); } catch { /* egal */ }
  if (vw.item) {
    toast("Erzeuge neu als " + FORMAT_LABEL[key] + " …");
    verwerten(vw.item);
  } else {
    // Freier Entwurf: nur das Etikett wechselt, Text und Prüfergebnisse bleiben stehen
    document.querySelectorAll(".format-chip").forEach(c => c.classList.toggle("active", c.dataset.format === key));
    toast("Format " + FORMAT_LABEL[key] + " — gilt fürs Überarbeiten und Speichern.");
  }
}

async function verwerten(item) {
  vw.item = item;
  vw.results = {};
  vw.draftId = null;   // frisch generiert = beim Speichern ein neuer Bibliothekseintrag
  vw.quelleText = "";
  vw.anweisung = "";
  vw.gesichert = null;
  vwShow();
  vwLoading();
  try {
    const data = await api("/api/items/" + item.id + "/verwerten",
                           { method: "POST", body: JSON.stringify({ format: vw.format }) });
    renderDraft(data.draft);
  } catch (e) {
    const body = $("vwBody");
    body.textContent = "";
    body.append(el("div", "vw-error", e.message));
    $("vwCopy").disabled = true;
    $("vwRetry").disabled = false;
  }
}

function scoreKlasse(score) {
  if (score === null || score === undefined) return "";
  return score >= 8 ? "hoch" : score >= 6 ? "mittel" : "gering";
}

function autosize(ta) {
  ta.style.height = "auto";
  ta.style.height = (ta.scrollHeight + 2) + "px";
}

function renderDraft(draft) {
  vw.draft = draft;
  vw.results = {};
  vw.include = {};
  const body = $("vwBody");
  body.textContent = "";
  body.classList.add("two-col");
  document.querySelector(".vw-panel").classList.add("breit");

  // Linke Spalte: Quelle + direkt editierbarer Entwurf
  const main = el("div", "vw-main");
  const quelle = vw.item ? vwQuelleZeile(vw.item) : (vw.quelleText || "Neuer Entwurf");
  main.append(el("div", "vw-quelle", quelle + " · Text direkt bearbeitbar"));
  // Format-Chips: Wechsel erzeugt den Entwurf neu (bei einem Fund) bzw. gilt fürs Überarbeiten
  const fz = el("div", "vw-format");
  FORMATE.forEach(f => {
    const c = el("button", "format-chip" + (vw.format === f.key ? " active" : ""), f.label);
    c.type = "button";
    c.dataset.format = f.key;
    c.title = f.hinweis;
    c.addEventListener("click", () => formatWechseln(f.key));
    fz.append(c);
  });
  main.append(fz);
  const ta = document.createElement("textarea");
  ta.className = "vw-draft";
  ta.value = draft;
  ta.maxLength = 12000;
  ta.spellcheck = false;
  ta.addEventListener("input", () => { vw.draft = ta.value; autosichern(); });
  if ("fieldSizing" in ta.style) {
    ta.style.fieldSizing = "content"; // Browser hält die Höhe selbst aktuell
  } else {
    const wachsen = () => autosize(ta);
    ta.addEventListener("input", wachsen);
    requestAnimationFrame(wachsen);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(wachsen);
  }
  main.append(ta);
  body.append(main);

  // Rechte Spalte: Prüfstand
  const zone = el("div", "pruef-zone");
  zone.append(el("div", "pruef-titel", "Prüfstand — wie die Zielgruppe urteilt"));
  const karten = el("div", "pruef-karten");
  PRUEFER_LISTE.forEach(p => karten.append(pruefKarte(p)));
  zone.append(karten);
  const anw = document.createElement("textarea");
  anw.className = "pruef-anweisung";
  anw.id = "vwAnweisung";
  anw.rows = 2;
  anw.maxLength = 2000;
  anw.placeholder = "Regie-Anweisung für die Überarbeitung (optional) — z. B. „nur Claudias Vorschlag 2 umsetzen, Rest ignorieren“";
  anw.value = vw.anweisung || "";  // bleibt über Überarbeitungs-Runden erhalten
  anw.addEventListener("input", () => { vw.anweisung = anw.value; });
  zone.append(anw);
  body.append(zone);

  $("vwCopy").disabled = vw.laufend;
  $("vwSave").disabled = vw.laufend;
  $("vwRetry").disabled = vw.laufend || !vw.item;
  $("vwLoop").disabled = vw.laufend;
  syncUeberarbeiten();
  autosichern();
}

/* ---------- Auto-Sicherung: übersteht Browser-Absturz und Reload ---------- */
const AUTOSAVE_KEY = "cockpit_vw_autosave";

function autosichern() {
  try {
    if (!vw.draft.trim()) return;
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({
      draft: vw.draft,
      anweisung: vw.anweisung || "",
      quelle: vw.item ? vwQuelleZeile(vw.item) : (vw.quelleText || "Wiederhergestellter Entwurf"),
      draftId: vw.draftId,
      ts: Date.now()
    }));
  } catch { /* Speicher voll o. ä. — Sicherung ist Komfort, kein Muss */ }
}

function checkAutosave() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(AUTOSAVE_KEY) || "null"); } catch { data = null; }
  if (!data || !data.draft || !data.draft.trim()) return;
  if (Date.now() - (data.ts || 0) > 72 * 3600 * 1000) {
    try { localStorage.removeItem(AUTOSAVE_KEY); } catch { /* egal */ }
    return;
  }
  if ($("restoreBar")) return;
  const bar = el("div", "restore-bar");
  bar.id = "restoreBar";
  const wann = new Date(data.ts).toLocaleString("de-DE", { hour: "2-digit", minute: "2-digit" });
  bar.append(el("span", "", "Nicht gesicherter LinkedIn-Entwurf gefunden (Stand " + wann + " Uhr) — vermutlich durch Absturz oder Neuladen unterbrochen."));
  const oeffnen = el("button", "vw-btn primary", "Öffnen");
  oeffnen.type = "button";
  oeffnen.addEventListener("click", () => {
    bar.remove();
    vw.item = null;
    vw.draftId = data.draftId || null;
    vw.quelleText = (data.quelle || "Wiederhergestellter Entwurf");
    vw.anweisung = data.anweisung || "";
    vw.gesichert = null;
    vwShow();
    renderDraft(data.draft);
  });
  const weg = el("button", "vw-btn", "Verwerfen");
  weg.type = "button";
  weg.addEventListener("click", () => {
    try { localStorage.removeItem(AUTOSAVE_KEY); } catch { /* egal */ }
    bar.remove();
  });
  bar.append(oeffnen, weg);
  $("bars").prepend(bar);
}

function pruefKarte(p) {
  const karte = el("div", "pruef-karte");
  karte.id = "pk-" + p.key;
  const kopf = el("div", "pruef-kopf");
  kopf.append(el("div", "pruef-avatar " + p.key, p.initial));
  const wer = el("div", "pruef-wer");
  wer.append(el("div", "pruef-name", p.name), el("div", "pruef-rolle", p.rolle));
  kopf.append(wer);
  const start = el("button", "pruef-start", "Bewerten lassen");
  start.type = "button";
  start.addEventListener("click", () => pruefenLassen(p));
  kopf.append(start);
  karte.append(kopf);
  return karte;
}

async function pruefenLassen(p, ausSchleife) {
  if (vw.laufend && !ausSchleife) return null; // Karten-Knöpfe während der Schleife gesperrt
  const karte = $("pk-" + p.key);
  if (!karte) return null;
  const kopf = karte.querySelector(".pruef-kopf");
  kopf.querySelectorAll(".pruef-start, .pruef-score, .pruef-check").forEach(n => n.remove());
  karte.querySelectorAll(".pruef-feedback, .pruef-fehler, .pruef-mini").forEach(n => n.remove());
  delete vw.results[p.key];
  delete vw.include[p.key];
  syncUeberarbeiten();
  const lade = el("div", "pruef-mini");
  const dots = el("span", "vw-dots"); dots.append(el("span"), el("span"), el("span"));
  lade.append(dots, el("span", "", p.name + " liest …"));
  kopf.insertAdjacentElement("afterend", lade);
  try {
    const r = await api("/api/pruefen", { method: "POST", body: JSON.stringify({ entwurf: vw.draft, pruefer: p.key }) });
    vw.results[p.key] = r;
    vw.include[p.key] = true;
    lade.remove();
    if (r.score !== null && r.score !== undefined) {
      kopf.append(el("div", "pruef-score " + scoreKlasse(r.score), r.score));
    }
    kopf.insertAdjacentElement("afterend", el("div", "pruef-feedback", r.feedback));
    // Auswahl: fließt dieses Urteil in die Überarbeitung ein?
    const check = el("label", "pruef-check");
    check.title = "Nur angehakte Urteile fließen in die Überarbeitung ein";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = true;
    cb.addEventListener("change", () => { vw.include[p.key] = cb.checked; syncUeberarbeiten(); });
    check.append(cb, el("span", "", "einbeziehen"));
    kopf.append(check);
    const neu = el("button", "pruef-start", "Neu");
    neu.type = "button"; neu.title = "Erneut bewerten lassen";
    neu.addEventListener("click", () => pruefenLassen(p));
    kopf.append(neu);
    syncUeberarbeiten();
    return r;
  } catch (e) {
    lade.remove();
    kopf.insertAdjacentElement("afterend", el("div", "pruef-fehler", e.message));
    const retry = el("button", "pruef-start", "Erneut");
    retry.type = "button";
    retry.addEventListener("click", () => pruefenLassen(p));
    kopf.append(retry);
    return null;
  }
}

function ausgewaehltesFeedback() {
  return Object.keys(vw.results || {})
    .filter(k => vw.include[k])
    .map(k => vw.results[k]);
}

function syncUeberarbeiten() {
  const anz = ausgewaehltesFeedback().length;
  const btn = $("vwRevise");
  if (btn) {
    btn.disabled = vw.laufend || anz === 0;
    btn.textContent = anz === 0 ? "Überarbeiten" : "Überarbeiten (" + anz + ")";
  }
}

async function ueberarbeiten() {
  const feedback = ausgewaehltesFeedback();
  if (!feedback.length) return false;
  const anweisung = (vw.anweisung || "").trim();
  const vorher = vw.draft;
  vwLoading("Überarbeite mit dem Feedback …");
  try {
    const data = await api("/api/ueberarbeiten", {
      method: "POST",
      body: JSON.stringify({ entwurf: vorher, feedback, anweisung, format: vw.format })
    });
    renderDraft(data.draft);
    if (!vw.laufend) toast("Überarbeitet — die Prüfer können erneut urteilen.");
    return true;
  } catch (e) {
    renderDraft(vorher); // alten Entwurf zurückholen
    toast(e.message);
    return false;
  }
}

/* Prüfschleife: beide Prüfer urteilen parallel; reicht es nicht, wird mit
   dem gesammelten Feedback überarbeitet und erneut geprüft. Stoppt, sobald
   ein Urteil BESTANDEN_AB erreicht — oder nach MAX_UEBERARBEITUNGEN Runden. */
const BESTANDEN_AB = 8;
const MAX_UEBERARBEITUNGEN = 2;

async function pruefSchleife() {
  if (vw.laufend || !vw.draft.trim()) return;
  vw.laufend = true;
  vw.stoppen = false;
  const loopBtn = $("vwLoop");
  loopBtn.textContent = "Stopp";
  loopBtn.title = "Prüfschleife anhalten — der aktuelle Stand bleibt stehen";
  ["vwCopy", "vwSave", "vwRetry", "vwRevise"].forEach(id => { $(id).disabled = true; });
  loopBtn.disabled = false; // bleibt bedienbar: er ist jetzt der Stopp-Knopf
  const titelEl = () => document.querySelector("#vwBody .pruef-titel");
  let fazit = "";
  try {
    for (let runde = 1; runde <= MAX_UEBERARBEITUNGEN + 1; runde++) {
      if ($("vwOverlay").hidden || vw.stoppen) { fazit = "Schleife gestoppt"; return; }
      const t = titelEl();
      if (t) t.textContent = "Prüfstand — Runde " + runde + " von " + (MAX_UEBERARBEITUNGEN + 1) + " läuft …";
      const ergebnisse = (await Promise.all(PRUEFER_LISTE.map(p => pruefenLassen(p, true)))).filter(Boolean);
      if (!ergebnisse.length) {
        fazit = "Prüfung fehlgeschlagen";
        toast("Prüfung fehlgeschlagen — bitte einzeln erneut versuchen.");
        return;
      }
      const best = Math.max(...ergebnisse.map(r => r.score ?? 0));
      if (best >= BESTANDEN_AB) {
        fazit = "bestanden in Runde " + runde + ", bestes Urteil " + best + "/10";
        toast("Bestanden in Runde " + runde + " — bestes Urteil " + best + "/10.");
        return;
      }
      if (vw.stoppen) { fazit = "Schleife gestoppt, bestes Urteil " + best + "/10"; return; }
      if (runde === MAX_UEBERARBEITUNGEN + 1) {
        fazit = "Schleife beendet, bestes Urteil " + best + "/10";
        toast("Bestes Urteil nach " + MAX_UEBERARBEITUNGEN + " Überarbeitungen: " + best + "/10 — ab hier hilft eine Regie-Anweisung oder Handarbeit.");
        return;
      }
      toast("Runde " + runde + ": bestes Urteil " + best + "/10 — überarbeite …");
      const ok = await ueberarbeiten();
      if (!ok) { fazit = "abgebrochen, Fehler bei der Überarbeitung"; return; }
    }
  } finally {
    vw.laufend = false;
    vw.stoppen = false;
    loopBtn.textContent = "Prüfschleife";
    loopBtn.title = "Alle Prüfer urteilen; bei Bedarf wird automatisch überarbeitet und erneut geprüft — bis ein Urteil mindestens 8/10 erreicht (max. 2 Überarbeitungen). Während des Laufs wird dieser Knopf zum Stopp.";
    const t = titelEl();
    if (t && fazit) t.textContent = "Prüfstand — " + fazit;
    if (!$("vwOverlay").hidden && $("vwBody").querySelector("textarea.vw-draft")) {
      $("vwCopy").disabled = false;
      $("vwSave").disabled = false;
      $("vwRetry").disabled = !vw.item;
      loopBtn.disabled = false;
      syncUeberarbeiten();
    } else {
      loopBtn.disabled = true;
    }
  }
}

async function saveDraft() {
  if (!vw.draft.trim()) { toast("Leerer Entwurf — nichts zu speichern."); return; }
  const btn = $("vwSave");
  btn.disabled = true;
  const text = vw.draft;
  // Gesamtnote plus Teilnoten je Persona; die Begründungen bleiben im Feedback-Text
  const scores = Object.values(vw.results || {}).map(r => ({
    pruefer: r.pruefer, name: r.name, score: r.score,
    dimensionen: (r.dimensionen || []).map(t => ({ name: t.name, score: t.score }))
  }));
  try {
    if (vw.draftId) {
      const body = { text };
      if (scores.length) body.scores = scores; // alte Urteile nicht mit leerer Liste überschreiben
      await api("/api/drafts/" + vw.draftId, { method: "PATCH", body: JSON.stringify(body) });
      vw.gesichert = text;
      toast("Entwurf aktualisiert.");
    } else {
      const d = await api("/api/drafts", { method: "POST", body: JSON.stringify({
        text,
        item_id: vw.item ? vw.item.id : null,
        item_title: vw.item ? vw.item.title : "",
        scores,
        format: vw.format
      }) });
      vw.draftId = d.id;
      vw.gesichert = text;
      state.counts.drafts = (state.counts.drafts || 0) + 1;
      render_counts_only();
      toast("Gespeichert — zu finden im Tab „Entwürfe“.");
    }
  } catch (e) {
    toast(e.message);
  }
  btn.disabled = false;
}

/* Schließen mit Verlust-Schutz: Klick NEBEN das Fenster schließt bewusst
   NICHT mehr (dort liegt editierbare Arbeit). Explizites Schließen fragt
   nach, wenn die Prüfschleife läuft oder ungesicherte Änderungen da sind. */
function vwSchliessenAnfragen() {
  if (vw.laufend) {
    if (!confirm("Die Prüfschleife läuft noch — wirklich abbrechen und schließen?")) return;
  } else if (vw.draft.trim() && vw.draft !== vw.gesichert) {
    if (!confirm("Der Entwurf ist nicht gespeichert und geht beim Schließen verloren.\n(Der Speichern-Knopf legt ihn im Tab „Entwürfe“ ab.)\n\nTrotzdem schließen?")) return;
  }
  vwHide();
}

/* ---------- Zeit & Toast ---------- */
function relTime(iso) {
  if (!iso) return "";
  const then = new Date(iso), now = new Date();
  const mins = Math.round((now - then) / 60000);
  if (isNaN(mins)) return "";
  if (mins < 1) return "gerade eben";
  if (mins < 60) return "vor " + mins + " Min.";
  const hours = Math.round(mins / 60);
  if (hours < 24) return "vor " + hours + " Std.";
  const days = Math.round(hours / 24);
  if (days === 1) return "gestern";
  if (days < 7) return "vor " + days + " Tagen";
  return then.toLocaleDateString("de-DE", { day: "numeric", month: "long" });
}
function absTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString("de-DE", { dateStyle: "full", timeStyle: "short" });
}

let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}

/* ---------- Update-Erkennung: offenes Fenster erfährt von neuen Deployments ---------- */
let appBuild = null;
let updateGemeldet = null;

async function versionCheck() {
  let v = null;
  try {
    const res = await fetch("/api/version", { cache: "no-store" });
    if (!res.ok) return;
    v = await res.json();
  } catch { return; /* offline o. ä. — beim nächsten Mal wieder */ }
  if (!v || !v.build) return;
  if (appBuild === null) { appBuild = v.build; return; }
  if (v.build === appBuild || v.build === updateGemeldet) return;
  updateGemeldet = v.build;
  if ($("updateBar")) return;
  const bar = el("div", "restore-bar");
  bar.id = "updateBar";
  bar.append(el("span", "", "Eine neue Version des Cockpits ist verfügbar. Ein offener Entwurf ist über die Auto-Sicherung geschützt."));
  const neu = el("button", "vw-btn primary", "Jetzt neu laden");
  neu.type = "button";
  neu.addEventListener("click", () => location.reload());
  const spaeter = el("button", "vw-btn", "Später");
  spaeter.type = "button";
  spaeter.addEventListener("click", () => bar.remove());
  bar.append(neu, spaeter);
  $("bars").prepend(bar);
}
