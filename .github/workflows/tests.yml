name: Tests

# Die Tests sollen nicht davon abhängen, dass jemand daran denkt, sie
# lokal zu starten — genau daran ist die Handprüfung schon einmal verfallen
# (siehe Änderungsprotokoll 2026-08-26 in CLAUDE.md).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"   # wie im Dockerfile
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Abhängigkeiten
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntaxprüfung (alle fünf Module)
        run: python -m py_compile app/main.py app/db.py app/auth.py app/pruefer.py app/transform.py

      - name: Tests
        # Kein Netz, keine Claude-Aufrufe — deshalb sind hier keine Secrets nötig.
        run: pytest -q
